# .github/workflows/deploy.yml
name: Test and Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest

  deploy-dashboard:
    needs: test
    runs-on: ubuntu-latest
    if: github.event.head_commit.message contains changes to streamlit/pages
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: |
          gcloud builds submit --tag gcr.io/edikte-analytics-2026/streamlit-app \
            --config deploy/streamlit/cloudbuild.yaml
          gcloud run deploy edikte-analytics-dashboard --image gcr.io/edikte-analytics-2026/streamlit-app ...